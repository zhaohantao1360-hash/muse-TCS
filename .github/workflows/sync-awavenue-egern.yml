name: Sync AWAvenue Egern module

# 每天跟随上游更新 AWAvenue 去广告 Egern 模块：
# 上游 TG-Twilight/AWAvenue-Ads-Rule 的 Surge RULE-SET 列表，
# 经 scripts/convert_awavenue_egern.py 转成 AWAvenue_Ads_egern.yaml；
# 转换输出是确定性的，上游不变时不产生提交。

on:
  schedule:
    # 每天 02:30 北京时间（上游一般在凌晨更新）
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert upstream Surge RULE-SET to Egern module
        run: |
          python3 scripts/convert_awavenue_egern.py \
            --url https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list \
            --output AWAvenue_Ads_egern.yaml
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AWAvenue_Ads_egern.yaml
          git diff --cached --quiet || git commit -m "Sync AWAvenue_Ads_egern.yaml from upstream" && git push
