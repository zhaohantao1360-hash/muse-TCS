# 抖音 / 字节跳动直连（Egern 模块）
# 来源：blackmatrix7/ios_rule_script 的 ByteDance.list（295 条）+ Richard4O4/clash-rules my_direct 的 ByteDance 段补漏，
# 由本仓库整理为 DIRECT 规则。请勿手动编辑；小豆/豆包小程序、抖音商城走这份直连。
# 上游 blackmatrix7 列表更新于 2024-02-03，域名本身稳定；my_direct 为持续维护的补充来源。
# 注意：AWAvenue 去广告模块同时 REJECT 了 pglstatp-toutiao.com 与 pangolin-sdk-toutiao-b.com（穿山甲/统计上报域名），
# 与本模块的 DIRECT 有重叠；两模块顺序决定这两个域名最终走哪条——它俩只是广告/统计上报，不影响商店打开。
name: 字节跳动直连
description: 抖音、豆包/小豆小程序及抖音商城直连：字节跳动全系域名（抖音、豆包、头条、西瓜、电商 ecombd、图片/视频 CDN 等）走直连、不走代理，含小豆小程序商店所需的 doubao.com、douyinec.com、ecombdapi.com、ecombdpage.com 及各 CDN 域名。
author: blackmatrix7（原版规则）；整理：muse-TCS
homepage: https://github.com/blackmatrix7/ios_rule_script

