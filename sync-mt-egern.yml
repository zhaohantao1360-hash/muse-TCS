name: Sync MT Egern module

# 每天跟随上游更新美团去广告 Egern 模块：
# 上游 muktsoen/SurgeRules 的 MT.sgmodule（本身每日从 ZenmoFeiShi/Qx 的 MT.snippet 同步）
# 经 scripts/convert_mt_egern.py 转成 MT_egern.yaml；转换输出是确定性的，
# 上游不变时不产生提交。

on:
  schedule:
    # 每天 18:00 北京时间（上游每日 17:32 左右更新，留半小时余量）
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert upstream MT.sgmodule to Egern module
        run: |
          python3 scripts/convert_mt_egern.py \
            --url https://raw.githubusercontent.com/muktsoen/SurgeRules/main/MT.sgmodule \
            --output MT_egern.yaml
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MT_egern.yaml
          git diff --cached --quiet || git commit -m "Sync MT_egern.yaml from upstream" && git push
